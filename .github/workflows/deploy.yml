name: Deploy Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
#
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pixi run --environment quarto --help
        env:
          PIXI_HOME: $HOME/.pixi

      - name: Register Jupyter kernel
        run: pixi run registe_kernel
        env:
          PIXI_HOME: $HOME/.pixi

      - name: Render Quarto
        run: pixi run render_site
        env:
          PIXI_HOME: $HOME/.pixi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site" # CHANGE THIS to match your project build folder (e.g., ./build, ./.next)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
