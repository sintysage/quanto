project:
  type: website
  output-dir: reports

author: Sinty Sage
website:
  site-url: "https://sinty-database.serveblog.net/quanto-site/"
  search:
    location: navbar
    type: overlay
  title: "Quanto"
  navbar:
    background: "#212121"
    href: /index.html
    logo-href: /index.html
    left:
      - text: "Home"
        href: index.html

    tools:
      - icon: github
        menu:
          - text: Source Code
            href: https://github.com/sintysage/quanto

format:
  html:
    css: styles.css
    # html-math-method: webtex
    toc: true
    lightbox: true
    code-fold: true
    fig-responsive: true
    code-tools:
      source: true
      toggle: false
      caption: none
    code-block-bg: true
    code-block-border-left: "#31BAE9"
    code-line-numbers: true
    comments:
      hypothesis: true

  ipynb: default

engine: jupyter
jupyter: main
